services:
  airplay:
    image: ${IMAGE_NAME:-airplay}
    build: .
    network_mode: host
    init: true
    devices:
      - /dev/snd
    cap_add:
      - SYS_NICE
    restart: unless-stopped
    stop_grace_period: 45s
    env_file:
      - .env
    logging:
      driver: journald
      options:
        tag: airplay
